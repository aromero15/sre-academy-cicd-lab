name: Main - CI/CD Lab

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run All Service Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Ejecutar pruebas
        run: bash scripts/test.sh

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen localmente
        run: docker build -t sre-academy-app:${{ github.sha }} .

  deploy-staging:
    name: Staging (SIMULACIÓN)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Simular despliegue a staging
        run: |
          echo "Desplegando a STAGING el commit ${{ github.sha }}"
          echo "SIMULACIÓN: no se despliega ningún servicio real"

  deploy-production:
    name: Production (SIMULACIÓN)
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - name: Simular despliegue a producción
        run: |
          echo "Desplegando a PRODUCTION el commit ${{ github.sha }}"
          echo "SIMULACIÓN: no se despliega ningún servicio real"

# PREGUNTA: ¿Qué sucedería si no completaras los needs?
# r/ Sin los needs, los  jobs correrían al mismo tiempo y
#    ninguno esperaría a los demás. Entonces se podría desplegar a
#    staging y prod aunque las pruebas fallaran o la imagen no se
#    construyera. Con "needs" se hace la cadena test -> build ->
#    deploy-staging -> deploy-production, cada job espera al anterior y
#    si uno falla los siguientes no se ejecutan.
